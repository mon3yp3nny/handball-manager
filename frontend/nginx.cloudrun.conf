server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cloud Run backend hostnames are resolved at request time, so nginx
    # needs an explicit resolver (its IPs are dynamic).
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 10s;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # API is now same-origin (proxied below), so connect-src 'self' covers
    # both XHR and the /ws WebSocket. Google/Apple entries are for OAuth.
    # fonts.googleapis.com (stylesheet) + fonts.gstatic.com (font files)
    # let the Google Fonts <link> in index.html load.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com https://appleid.cdn-apple.com; style-src 'self' 'unsafe-inline' https://accounts.google.com https://fonts.googleapis.com; frame-src https://accounts.google.com https://appleid.apple.com; connect-src 'self' https://accounts.google.com https://appleid.apple.com; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com;" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Reverse-proxy the API to the backend Cloud Run service. Serving it
    # under the same origin as the SPA makes the httpOnly auth cookie a
    # first-party cookie — *.run.app is a public suffix, so a direct
    # cross-origin call would make the cookie third-party and browsers
    # (Safari always, Chrome by default) silently drop it.
    location /api/ {
        set $api_backend https://handball-backend-218596927281.europe-west1.run.app;
        proxy_pass $api_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host handball-backend-218596927281.europe-west1.run.app;
        proxy_ssl_server_name on;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        # FastAPI's trailing-slash 307s (and any other redirect) carry an
        # absolute Location with the backend's own host. Rewrite it back to
        # a same-origin path so the browser follows it through this proxy
        # instead of cross-origin (which CSP blocks and where the cookie
        # wouldn't travel).
        proxy_redirect https://handball-backend-218596927281.europe-west1.run.app/ /;
        proxy_redirect http://handball-backend-218596927281.europe-west1.run.app/ /;
    }

    # WebSocket endpoint — same origin, proxied with upgrade headers.
    location /ws {
        set $ws_backend https://handball-backend-218596927281.europe-west1.run.app;
        proxy_pass $ws_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host handball-backend-218596927281.europe-west1.run.app;
        proxy_ssl_server_name on;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
